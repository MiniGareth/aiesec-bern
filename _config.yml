# ============================================================
# SITE CONFIGURATION
# PLACEHOLDER: title, description, url, and domain below are
# placeholders. Moderator should replace with real values once
# the custom domain and branding are finalized.
# ============================================================
title: "AIESEC in Bern"
description: "AIESEC in Bern - youth leadership development and global exchange opportunities."
# PLACEHOLDER: replace with the real custom domain once DNS is configured
url: "https://www.aiesecbern.ch"
baseurl: ""

# PLACEHOLDER contact info - update once confirmed by the moderator
email: "info.be@aiesec.ch"
social:
  instagram: "https://www.instagram.com/aiesec_bern/"
  linkedin: "https://www.linkedin.com/company/aiesec-in-bern/"

# PLACEHOLDER external sign-up / apply form link.
# Used on: Exchanges flowchart CTA, Opportunity page button,
# Become a Member "Apply now" button.
signup_link: "https://tally.so/r/A7MOvk"

# PLACEHOLDER office address
office_address: "Schanzenstrasse 1, 3012 Bern, Switzerland"

# Image variables
conference_hero_img: "/assets/images/kick-off-0.jpeg"
membership_hero_img: "/assets/images/post-kick-off-trip.png"
partnership_hero_img: "/assets/images/redbull-sdgs.JPG"
exchange_hero_img: "/assets/images/ogx flyers.JPG"

future: true

collections:
  events:
    output: true
    permalink: /events/:path/
  opportunities:
    output: true
    permalink: /exchanges/opportunities/:path/
  testimonials:
    output: true
    permalink: /exchanges/testimonials/:path/
  members:
    output: false

defaults:
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "opportunities"
    values:
      layout: "opportunity"
  - scope:
      path: ""
      type: "testimonials"
    values:
      layout: "testimonial"

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
